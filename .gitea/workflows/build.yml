name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: tig.koszek.com/wkoszek/coreapp-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITEA_TOKEN }}
    steps:
      - name: Clone repo
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 -b "$REF" \
            "http://$ACTOR:$TOKEN@gitea:3000/$REPO.git" .
          # Keep the token out of .git/config before running repo code.
          git remote set-url origin "http://gitea:3000/$REPO.git"

      # The script needs macOS Quartz to run, so on Linux we only check
      # that it parses.
      - name: syntax check
        run: python3 -c "import ast; ast.parse(open('clean_keyboard').read())"
